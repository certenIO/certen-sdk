name: Onboarding end-to-end

# The journey every customer walks — sign up from nothing, create an identity, check it can pay,
# execute a proof-gated call, verify the proof. It is the only journey with no automated coverage,
# because until self-service signup landed its first step required a human in a browser.
#
# Nightly rather than per-push, deliberately. A full run creates a real organization and spends real
# testnet funds, so per-push would leave a trail of scratch orgs and a running cost for a signal that
# changes rarely. Nightly bounds both and still catches a break within a day. `workflow_dispatch` is
# there so it can be run on demand the moment something is deployed.
#
# NOTHING is handed to this workflow as a credential. It signs up with a keypair generated inside the
# run and thrown away — which is the entire reason that path exists. The only input is the URL of the
# gateway to point at.

on:
  schedule:
    # Weekly, not nightly — 04:20 UTC on Mondays. Offset from the CI cron at 03:30 so the two do not
    # contend for runners.
    #
    # Each run signs up for real, so it creates a real organization and consumes a real trial grant.
    # Nightly meant 365 abandoned orgs a year, each holding credit, accumulating in the operator
    # console forever — a cost the workflow's author (me) did not think about when choosing the
    # cadence. Weekly still catches a broken onboarding path within days.
    #
    # Revisit once abandoned self-service orgs are swept automatically; nightly is the better signal
    # if the cleanup exists.
    - cron: '20 4 * * 1'
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Gateway to run against'
        required: false
        default: 'https://gateway.kompendium.co'
      # No `contract` input: the proof cycle is a value transfer, which exercises the same
      # proof-gated path — open, sign, submit, anchor, prove — with no contract ABI to go stale.

jobs:
  onboarding:
    name: Sign up from nothing and prove some work
    runs-on: ubuntu-latest
    # Generous: the run waits on real identity provisioning, which is a chain of Accumulate
    # transactions each waiting for the previous to anchor. Bounded so a hung downstream cannot hold
    # a runner all night.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The e2e drives the built CLI, not the sources — so this exercises what a customer installs.
      - name: Build
        run: npm run build

      # Fails the job before the e2e runs if the deployment cannot serve this build. Without it a
      # 404 on a moved path would surface as a mysterious step failure rather than as version skew,
      # which is the exact confusion `ENDPOINT_NOT_ON_GATEWAY` exists to remove.
      - name: Does the deployment serve this build?
        env:
          CERTEN_API_URL: ${{ github.event.inputs.gateway_url || 'https://gateway.kompendium.co' }}
        run: npm run check:gateway

      # Place the signing key the proof cycle needs, if one is configured.
      #
      # The proof cycle cannot run on the organization this workflow just created: a brand-new
      # abstract account holds no gas, so its execution leg parks at `anchoring` forever. It runs
      # instead against a maintained, funded identity — which means the runner needs the key that
      # authorizes it.
      #
      # That is a real private key in CI, so it must be a DEDICATED one: used for nothing else,
      # controlling one testnet identity whose account holds a trivial balance. It authorizes
      # transfers from that account and nothing more. Never reuse an operator key here.
      #
      # Written to the runner's home because the script copies the named key from there into its own
      # isolated home — which is what keeps the API key this run obtains separate from everything
      # else on the machine.
      - name: Place the proof-cycle signing key
        if: ${{ secrets.E2E_SIGNING_KEY != '' }}
        env:
          KEY_JSON: ${{ secrets.E2E_SIGNING_KEY }}
          KEY_NAME: ${{ secrets.E2E_SIGNING_KEY_NAME }}
        run: |
          mkdir -p "$HOME/.certen/keys"
          printf '%s' "$KEY_JSON" > "$HOME/.certen/keys/${KEY_NAME:-e2e}.json"
          chmod 600 "$HOME/.certen/keys/${KEY_NAME:-e2e}.json"

      - name: Onboard from nothing
        env:
          CERTEN_API_URL: ${{ github.event.inputs.gateway_url || 'https://gateway.kompendium.co' }}
          # All three are needed together, or the proof cycle is skipped rather than half-run. The
          # script reports a skip as a skip and never as a pass, so an unconfigured repository gets
          # an honest partial result instead of a green tick over work that never happened.
          PROOF_IDENTITY: ${{ secrets.E2E_PROOF_IDENTITY }}
          PROOF_FROM: ${{ secrets.E2E_PROOF_FROM }}
          PROOF_KEY: ${{ secrets.E2E_SIGNING_KEY_NAME }}
        run: |
          ARGS="--url $CERTEN_API_URL"
          if [ -n "$PROOF_IDENTITY" ] && [ -n "$PROOF_FROM" ] && [ -n "$PROOF_KEY" ]; then
            ARGS="$ARGS --proof-identity $PROOF_IDENTITY --sign-with $PROOF_KEY --proof-from $PROOF_FROM"
          else
            echo "Proof cycle not configured — set E2E_PROOF_IDENTITY, E2E_PROOF_FROM,"
            echo "E2E_SIGNING_KEY and E2E_SIGNING_KEY_NAME to exercise it."
          fi
          node scripts/e2e-onboarding.mjs $ARGS

      # Runs even when the e2e fails, because a regression in round trips is worth seeing next to the
      # failure rather than only when everything is green.
      - name: Measure the journey
        if: always()
        env:
          CERTEN_API_URL: ${{ github.event.inputs.gateway_url || 'https://gateway.kompendium.co' }}
        run: |
          echo "Read-path measurement is skipped here: it needs a long-lived API key, and this"
          echo "workflow deliberately holds none. Run it by hand against staging:"
          echo "  node scripts/measure-onboarding.mjs --url \$CERTEN_API_URL --key \$KEY --full"
